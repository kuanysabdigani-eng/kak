<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visionary Studio Pro</title>
    <style>
        :root {
            --bg: #050508;
            --card: rgba(24, 24, 27, 0.75);
            --accent: #8b5cf6;
            --danger: #ef4444;
            --text: #f4f4f5;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 380px;
            background: var(--card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            box-sizing: border-box;
        }
        h1 { margin-top: 0; font-size: 18px; text-align: center; color: #c084fc; letter-spacing: 0.5px; }
        
        .player-container {
            position: relative;
            width: 100%;
            aspect-ratio: 9/16;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .subtitle-overlay {
            position: absolute;
            bottom: 22%;
            width: 88%;
            text-align: center;
            color: #ffffff;
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            font-family: system-ui, -apple-system, sans-serif;
