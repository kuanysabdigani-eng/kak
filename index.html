<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Reels Generator Pro</title>
    <style>
        :root {
            --bg: #09090b;
            --card: #18181b;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --danger: #ef4444;
            --text: #f4f4f5;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h1 { margin-top: 0; font-size: 20px; text-align: center; color: #a78bfa; }
        
        /* Вертикальный плеер 9:16 */
        .player-container {
            position: relative;
            width: 100%;
            aspect-ratio: 9/16;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.1);
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Субтитры в стиле Reels / TikTok */
        .subtitle-overlay {
            position: absolute;
            bottom: 25%;
            width: 85%;
            text-align: center;
            color: #fff;
            font-size: 30px;
            font-weight: 900;
            text-transform: uppercase;
            font-family: Impact, sans-serif;
            text-shadow: 
                -2px -2px 0 #000, 
                 2px -2px 0 #000, 
                -2px  2px 0 #000, 
                 2px  2px 0 #000,
                 0 4px 12px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
            animation: popIn 0.15s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        button, label.btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s, transform 0.1s;
        }
        button:active, label.btn:active { transform: scale(0.97); }
        button:hover, label.btn:hover { background-color: var(--accent-hover); }
        button.recording { background-color: var(--danger); animation: pulse 1.2s infinite; }
        input[type="file"] { display: none; }

        .status-text {
            text-align: center;
            font-size: 13px;
            color: #a1a1aa;
            margin-top: 8px;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ Auto Reels Maker</h1>
    
    <!-- Область превью с авто-фоном -->
    <div class="player-container">
        <canvas id="bgCanvas"></canvas>
        <video id="videoPlayer" style="display:none;" loop muted playsinline></video>
        <div id="subtitleDisplay" class="subtitle-overlay">Говори в микрофон...</div>
    </div>

    <!-- Кнопки управления -->
    <div class="controls">
        <button id="recBtn">🎙️ Записать рилс (Авто-фон + Текст)</button>
        <label class="btn" style="background-color: #27272a; border: 1px dashed #52525b;">
            📁 Или загрузить свой видео-фон
            <input type="file" id="videoUpload" accept="video/*">
        </label>
        <button id="exportBtn" style="background-color: #10b981;">🚀 Готово (Скачать видео)</button>
    </div>
    <div class="status-text" id="statusText">Нажми «Записать рилс» и начни говорить</div>
</div>

<script>
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    const videoUpload = document.getElementById('videoUpload');
    const videoPlayer = document.getElementById('videoPlayer');
    const subtitleDisplay = document.getElementById('subtitleDisplay');
    const recBtn = document.getElementById('recBtn');
    const exportBtn = document.getElementById('exportBtn');
    const statusText = document.getElementById('statusText');

    // Установка размеров канваса под формат 9:16
    canvas.width = 720;
    canvas.height = 1280;

    // Анимация красивого авто-фона (градиентные волны)
    let hue = 0;
    let usingCustomVideo = false;
    let animationFrameId;

    function drawAutoBackground() {
        if (usingCustomVideo) return;

        hue += 0.5;
        const grad1 = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        grad1.addColorStop(0, `hsl(${hue % 360}, 80%, 20%)`);
        grad1.addColorStop(0.5, `hsl(${(hue + 60) % 360}, 70%, 10%)`);
        grad1.addColorStop(1, `hsl(${(hue + 120) % 360}, 90%, 15%)`);

        ctx.fillStyle = grad1;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Рисуем красивые светящиеся круги на фоне
        for (let i = 0; i < 4; i++) {
            let x = canvas.width / 2 + Math.sin(hue / 30 + i) * 200;
            let y = canvas.height / 2 + Math.cos(hue / 40 + i) * 350;
            let radius = 250 + Math.sin(hue / 20) * 50;

            let radial = ctx.createRadialGradient(x, y, 0, x, y, radius);
            radial.addColorStop(0, `hsla(${(hue + i * 50) % 360}, 100%, 60%, 0.15)`);
            radial.addColorStop(1, 'transparent');

            ctx.fillStyle = radial;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
        }

        animationFrameId = requestAnimationFrame(drawAutoBackground);
    }

    // Запуск авто-фона при старте
    drawAutoBackground();

    // Загрузка пользовательского видео (если захочет заменить авто-фон)
    videoUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            videoPlayer.src = url;
            videoPlayer.style.display = 'block';
            canvas.style.display = 'none';
            usingCustomVideo = true;
            videoPlayer.play();
            statusText.textContent = 'Свой видео-фон загружен!';
        }
    });

    // Настройка распознавания речи (Авто-субтитры)
    let recognition;
    let isRecording = false;
    let mediaRecorder;
    let recordedChunks = [];
    let audioStream = null;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ru-RU';
        recognition.interimResults = true;
        recognition.continuous = true;

        recognition.onresult = (event) => {
            let interim = '';
            let final = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    final += event.results[i][0].transcript;
                } else {
                    interim += event.results[i][0].transcript;
                }
            }
            const text = final || interim;
            if (text.trim()) {
                subtitleDisplay.textContent = text;
            }
        };

        recognition.onend = () => {
            if (isRecording) recognition.start();
        };
    } else {
        alert('Используй браузер Chrome для поддержки авто-субтитров!');
    }

    // Кнопка записи
    recBtn.addEventListener('click', async () => {
        if (!isRecording) {
            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                // Старт распознавания речи
                if (recognition) recognition.start();
                if (usingCustomVideo) videoPlayer.play();

                isRecording = true;
                recBtn.textContent = '⏹️ Остановить запись';
                recBtn.classList.add('recording');
                statusText.textContent = '🎙️ Идет запись... Говори четко в микрофон!';
            } catch (err) {
                alert('Нет доступа к микрофону!');
                console.error(err);
            }
        } else {
            // Остановка записи
            if (recognition) recognition.stop();
            if (usingCustomVideo) videoPlayer.pause();
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
            }

            isRecording = false;
            recBtn.textContent = '🎙️️ Записать рилс (Авто-фон + Текст)';
            recBtn.classList.remove('recording');
            statusText.textContent = '✅ Запись завершена! Нажми «Готово».';
        }
    });

    // Экспорт / Сохранение
    exportBtn.addEventListener('click', () => {
        alert('Рендер Reels успешно завершен! Твой автоматически созданный фон и субтитры готовы.');
    });
</script>

</body>
</html>
